[project]
name = "route53-console-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2", "email-validator>=2.2,<3", "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3", "sqlalchemy>=2.0,<3", "uvicorn[standard]>=0.32,<1"
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "ruff>=0.8,<1"]
